# Apache vhost for polticool.nathanspackman.com -> Phoenix container on 127.0.0.1:4010
#
# Install (once, on the server):
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo cp deploy/apache/polticool.conf /etc/apache2/sites-available/polticool.conf
#   sudo a2ensite polticool && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d polticool.nathanspackman.com
#
# certbot adds the :443 vhost (polticool-le-ssl.conf), copying the proxy rules below.
# Cloudflare is proxying this hostname, so set its SSL/TLS mode to "Full (strict)".

<VirtualHost *:80>
    ServerName polticool.nathanspackman.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Phoenix's force_ssl reads X-Forwarded-Proto (see config/prod.exs).
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # LiveView websocket
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:4010/$1 [P,L]

    ProxyPass        / http://127.0.0.1:4010/
    ProxyPassReverse / http://127.0.0.1:4010/

    ErrorLog ${APACHE_LOG_DIR}/polticool_error.log
    CustomLog ${APACHE_LOG_DIR}/polticool_access.log combined
</VirtualHost>
