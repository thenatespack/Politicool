name: Deploy

# Every push to main: test -> build image -> push to GHCR -> SSH to the server,
# migrate, restart. See deploy/README.md for the one-time server setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1.1"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://polticool.nathanspackman.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/polticool
          strip_components: 1

      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ env.IMAGE }}
          APP_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,APP_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd /opt/polticool
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE APP_TAG

            # Persist the deployed image in .env so later manual `docker compose`
            # commands (up/exec/run) resolve to this build instead of the compose
            # default. Rewrite in place (cat >) to keep .env's owner and mode 600.
            touch .env
            tmp="$(mktemp)"
            grep -v -e '^APP_IMAGE=' -e '^APP_TAG=' .env > "$tmp" || true
            if [ -s "$tmp" ] && [ -n "$(tail -c1 "$tmp")" ]; then echo >> "$tmp"; fi
            printf 'APP_IMAGE=%s\nAPP_TAG=%s\n' "$APP_IMAGE" "$APP_TAG" >> "$tmp"
            cat "$tmp" > .env
            rm -f "$tmp"

            docker compose pull app
            docker compose up -d db
            docker compose run --rm app bin/migrate
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f

            # Smoke test through the container port (Host header skips force_ssl).
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null -H "Host: localhost" http://127.0.0.1:4010/; then
                echo "App is up ($APP_TAG)"; exit 0
              fi
              sleep 2
            done
            echo "App did not come up"; docker compose logs --tail=100 app; exit 1
